services:
  portal:
    image: nginx:stable-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./runtime/site:/srv/site:ro
      - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

  panel:
    profiles: [managed]
    build:
      context: ./vendor/WG_Panel
      dockerfile: Dockerfile
    image: wg-portal-panel:local
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    environment:
      WG_CONTAINER_ROLE: panel
      DOCKER_MODE: "1"
      BIND: ${WG_PANEL_BIND:-127.0.0.1:8766}
      DATABASE_URL: sqlite:///instance/wg_panel.db
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      FERNET_KEY: ${FERNET_KEY:-}
      API_KEY: ${API_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      WIREGUARD_CONF_PATH: /etc/wireguard
    volumes:
      - panel_data:/app/instance
      - /etc/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    stop_grace_period: 30s

  telegram-bot:
    profiles: [telegram]
    image: wg-portal-panel:local
    command: ["python", "telegram_bot.py"]
    restart: unless-stopped
    network_mode: host
    environment:
      WG_CONTAINER_ROLE: bot
      DOCKER_MODE: "1"
      PANEL_BASE_URL: ${PANEL_BASE_URL:-http://127.0.0.1:8766}
      PANEL: ${PANEL_BASE_URL:-http://127.0.0.1:8766}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      FERNET_KEY: ${FERNET_KEY:-}
      API_KEY: ${API_KEY:-}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
    volumes:
      - panel_data:/app/instance

volumes:
  panel_data:
